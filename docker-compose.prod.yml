# Hill Booker on a shared VPS. Own database, no database port opened to the internet,
# API on port 8100 so it does not clash with other apps.
name: roomly
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: roomly
    volumes:
      - roomly_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  api:
    build: ./backend
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "172.18.0.1:8100:8000"
    environment:
      DATABASE_URL: postgresql://roomly:${DB_PASSWORD}@db:5432/roomly
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ALLOW_FAKE_CONFIRM: ${ALLOW_FAKE_CONFIRM:-true}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      BUSINESS_NAME: ${BUSINESS_NAME:-Hill Booker}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-}
      BUSINESS_PHONE: ${BUSINESS_PHONE:-}
      COMMISSION_PERCENT: ${COMMISSION_PERCENT:-2}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SITE_URL: ${SITE_URL:-https://hillbooker.com}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-new_booking}
      WHATSAPP_LANG: ${WHATSAPP_LANG:-en}
      WHATSAPP_INVOICE_TEMPLATE: ${WHATSAPP_INVOICE_TEMPLATE:-}
      WHATSAPP_HOST_COPY_TEMPLATE: ${WHATSAPP_HOST_COPY_TEMPLATE:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENV: ${CASHFREE_ENV:-sandbox}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-}
    volumes:
      - roomly_uploads:/data/uploads
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "172.18.0.1:3100:3000"
volumes:
  roomly_pg:
  roomly_uploads:
