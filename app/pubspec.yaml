name: roomly_app
description: Hill Booker, rooms across India. Guest app.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  razorpay_flutter: ^1.3.7
  image_picker: ^1.0.7
  url_launcher: ^6.2.0
  flutter_web_auth_2: ^4.1.0
  google_sign_in: ^6.2.1 # the pop-up that lists the Google accounts on the phone
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_mark.png
  # Figtree, same as the website. The build workflow makes these files from
  # Google Fonts' Figtree before building, so they are not kept in git.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
        - asset: assets/fonts/Figtree-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FAF9F4"
  adaptive_icon_foreground: "assets/icon_fg.png"
