name: roomly_app
description: Hill Booker, rooms across India. Guest app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  razorpay_flutter: ^1.3.7
  image_picker: ^1.0.7
  url_launcher: ^6.2.0
  flutter_web_auth_2: ^4.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_mark.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FAF9F4"
  adaptive_icon_foreground: "assets/icon_fg.png"
