name: Build Android APK (Hill Booker)

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend address the app talks to (for example https://api.example.com)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project around our code
        run: flutter create . --platforms=android --project-name roomly_app --org in.roomly

      - name: Allow internet and plain http (for testing)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          grep -q usesCleartextTraffic $M || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M

      - name: Allow notifications on Android 13 and newer
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' $M

      - name: Let the guest take a photo of an ID card
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' $M

      - name: Firebase needs Android 6 or newer
        run: sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle*

      - name: Keep the package name valid on newer Flutter
        run: |
          for F in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$F" ] && sed -i -E '/namespace|applicationId/ s/`//g' "$F" || true
          done
          grep -nE 'namespace|applicationId' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true

      - name: Set up notifications from google-services.json
        run: |
          if [ -f google-services.json ]; then python3 tool/make_firebase_options.py; else echo "No google-services.json, building without notifications"; fi

      - name: Let the app receive the return from Google sign-in
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q CallbackActivity $M || sed -i 's#</application>#<activity android:name="com.linusu.flutter_web_auth_2.CallbackActivity" android:exported="true"><intent-filter android:label="flutter_web_auth_2"><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="hillbooker"/></intent-filter></activity></application>#' $M

      - name: Set the app name shown on the phone
        run: sed -i 's#android:label="[^"]*"#android:label="Hill Booker"#' android/app/src/main/AndroidManifest.xml

      - name: Get the Figtree font (same as the website)
        run: |
          python3 -m pip install --quiet --break-system-packages fonttools || python3 -m pip install --quiet fonttools
          mkdir -p assets/fonts
          curl -fsSL -o /tmp/Figtree.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/figtree/Figtree%5Bwght%5D.ttf"
          for W in 400 500 600 700 800; do
            python3 -m fontTools.varLib.instancer /tmp/Figtree.ttf wght=$W -o assets/fonts/Figtree-$W.ttf
          done
          ls -la assets/fonts

      - run: flutter pub get

      - name: Make the app icon from the logo
        run: dart run flutter_launcher_icons

      # One fixed signing key, kept only in the repository secret HB_SIGNING_KEYSTORE_BASE64. With it every build is
      # signed the same way, so a new APK installs over the old one and Google's account pop-up recognises the app.
      # The release build already signs with the debug key, so the key just takes the debug key's place.
      - name: Sign with the Hill Booker key
        env:
          KEY: ${{ secrets.HB_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then
            for D in "$HOME/.android" ${ANDROID_USER_HOME:+"$ANDROID_USER_HOME"}; do
              mkdir -p "$D"
              printf '%s' "$KEY" | tr -d '[:space:]' | base64 -d > "$D/debug.keystore"
            done
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E 'SHA1:' || true
            echo "Signed with the Hill Booker key."
          else
            echo "No HB_SIGNING_KEYSTORE_BASE64 secret: signed with a throwaway key (Google sign-in uses the browser)."
          fi

      - name: Build APK
        run: |
          API="${{ inputs.api_base || vars.API_BASE || 'https://api.hillbooker.com' }}"
          echo "Building against $API"
          flutter build apk --release --dart-define=API_BASE="$API"

      - uses: actions/upload-artifact@v4
        with:
          name: roomly-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
