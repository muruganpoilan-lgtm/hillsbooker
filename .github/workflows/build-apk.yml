name: Build Android APK (Hill Booker)

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend address the app talks to (for example https://api.example.com)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project around our code
        run: flutter create . --platforms=android --project-name roomly_app --org in.roomly

      - name: Allow internet and plain http (for testing)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          grep -q usesCleartextTraffic $M || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M

      - name: Let the app receive the return from Google sign-in
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q CallbackActivity $M || sed -i 's#</application>#<activity android:name="com.linusu.flutter_web_auth_2.CallbackActivity" android:exported="true"><intent-filter android:label="flutter_web_auth_2"><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="hillbooker"/></intent-filter></activity></application>#' $M

      - name: Set the app name shown on the phone
        run: sed -i 's#android:label="[^"]*"#android:label="Hill Booker"#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Make the app icon from the logo
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: |
          API="${{ inputs.api_base || vars.API_BASE || 'http://10.0.2.2:8000' }}"
          flutter build apk --release --dart-define=API_BASE="$API"

      - uses: actions/upload-artifact@v4
        with:
          name: roomly-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
