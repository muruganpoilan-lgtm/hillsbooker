services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roomly
      POSTGRES_PASSWORD: roomly
      POSTGRES_DB: roomly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
